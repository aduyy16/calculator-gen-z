<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1ff62">
  <title>Good Mood Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="Good Mood Calculator home">
        <span class="wordmark-icon" aria-hidden="true">+</span>
        <span>good mood<span class="wordmark-light">.calc</span></span>
      </a>
      <div class="palette-picker" aria-label="Choose a color palette">
        <span class="palette-label">THE VIBE</span>
        <button class="swatch is-selected" type="button" data-theme="pop" aria-label="Pop palette" aria-pressed="true"><span></span></button>
        <button class="swatch" type="button" data-theme="peach" aria-label="Peach palette" aria-pressed="false"><span></span></button>
        <button class="swatch" type="button" data-theme="lilac" aria-label="Lilac palette" aria-pressed="false"><span></span></button>
      </div>
    </header>

    <section class="workspace" aria-label="Calculator">
      <div class="calculator">
        <div class="calculator-heading">
          <span>YOUR LITTLE NUMBER FRIEND</span>
          <span class="live-indicator"><i></i> READY</span>
        </div>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display-expression" id="expression">0</div>
          <div class="display-result" id="result">let's make it count<span class="cursor"></span></div>
        </div>

        <div class="keypad" aria-label="Calculator keypad">
          <button class="key key-utility" type="button" data-action="clear" aria-label="All clear">AC</button>
          <button class="key key-utility" type="button" data-action="sign" aria-label="Toggle sign">+/−</button>
          <button class="key key-utility" type="button" data-action="percent" aria-label="Percent">%</button>
          <button class="key key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key key-operator" type="button" data-operator="+" aria-label="Add">+</button>

          <button class="key key-delete" type="button" data-action="delete" aria-label="Delete last character">⌫</button>
          <button class="key" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
        <footer class="calculator-footer"><span>SMALL STEPS, BIG NUMBERS</span><span>EST. 2024</span></footer>
      </div>

      <aside class="history-panel" aria-label="Recent calculations">
        <div class="history-heading">
          <div><span class="section-kicker">THE RECEIPTS</span><h1>Recent</h1></div>
          <button class="clear-history" id="clear-history" type="button" aria-label="Clear calculation history" title="Clear history">⌫</button>
        </div>
        <ol class="history-list" id="history-list"></ol>
        <p class="history-empty" id="history-empty">Your next big brain moment goes here.</p>
        <div class="history-note"><span class="note-star" aria-hidden="true">✳</span><span>GOOD THINGS ADD UP.</span></div>
      </aside>
    </section>

    <div class="bottom-note"><span>MADE FOR THE MOMENT</span><span>NO THOUGHTS, JUST MATH <b>↗</b></span></div>
  </main>
</body>
</html>
